<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions of gradients -->
  <defs>
    <!-- Gradual transition color for line graph -->
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Neural Connection Nodes -->
  <circle cx="160" cy="350" r="16" fill="#2dd4bf" />
  <circle cx="280" cy="320" r="12" fill="#2dd4bf" />
  <circle cx="200" cy="200" r="14" fill="#818cf8" />
  <circle cx="340" cy="180" r="16" fill="#818cf8" />
  <circle cx="420" cy="300" r="12" fill="#2dd4bf" />

  <!-- Connection Lines (Dotted/Dashed for ML connection aesthetic) -->
  <line x1="160" y1="350" x2="280" y2="320" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />
  <line x1="160" y1="350" x2="200" y2="200" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />
  <line x1="280" y1="320" x2="340" y2="180" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />
  <line x1="200" y1="200" x2="340" y2="180" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />
  <line x1="280" y1="320" x2="420" y2="300" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />
  <line x1="340" y1="180" x2="420" y2="300" stroke="#f3f4f6" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Rising Line Graph Curve -->
  <path d="M 80 420 L 160 350 L 280 320 L 340 180 L 450 100" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Head for Line Graph -->
  <path d="M 410 100 L 450 100 L 450 140" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
